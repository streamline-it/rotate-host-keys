---
- name: ensure current host private keys are removed
  tags: rotate-host-keys
  loop:
    "{{ rotate_host_keys_target_hosts }}"
  ansible.builtin.file:
    path: "{{ item['homedir'] }}/.ssh/id_rsa-{{ item['hostname'] }}"
    state: absent

- name: ensure current host public keys are removed
  tags: rotate-host-keys
  loop:
    "{{ rotate_host_keys_target_hosts }}"
  ansible.builtin.file:
    path: "{{ item['homedir'] }}/.ssh/id_rsa-{{ item['hostname'] }}.pub"
    state: absent
