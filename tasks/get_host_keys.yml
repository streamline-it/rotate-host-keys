---
- name: catch error
  block:
    - name: fetch host keys
      tags: rotate-host-keys
      register:  fetch_task
      failed_when: 
        - fetch_task['failed'] == true
        - fetch_task['msg'] != "the remote file does not exist, not transferring, ignored"
      loop:
        "{{ rotate_host_keys_target_hosts }}"
      ansible.builtin.fetch:
        src: "{{ item['homedir'] }}/.ssh/id_rsa-{{ item['hostname'] }}.pub"
        dest: ./hosts

  rescue:
    
    - name: if the key doesn't exist, continue
      tags: rotate-host-keys
      loop:
        "{{ rotate_host_keys_target_hosts }}"
      loop_control:
        index_var: rotate_host_keys_index
      when: 
        - fetch_task['results'][rotate_host_keys_index]['failed'] == true
        - "'remote file does not exist' in fetch_task['results'][rotate_host_keys_index]['msg']"
      ansible.builtin.debug:
        msg: "Probably new host or first time this role was run, the key file doesn't exist, No problem, continue.."

    - name: some other error condition, fail out
      tags: rotate-host-keys
      loop:
        "{{ rotate_host_keys_target_hosts }}"
      loop_control:
        index_var: rotate_host_keys_index
      when: 
        - fetch_task['results'][rotate_host_keys_index]['failed'] == true
        - "'remote file does not exist' not in fetch_task['results'][rotate_host_keys_index]['msg']"
      ansible.builtin.fail:
        msg: "Unknown error.  Failing out."
